name: Build and push image

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["README.md", "docs/**"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 올린 곡을 변환하고 태그를 읽는 데 ffmpeg 와 ffprobe 를 씁니다.
      - run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0  # Dockerfile 의 flutter 이미지와 같이 올립니다
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # 안드로이드 앱입니다. 서버 이미지에 넣어 /solo.apk 로 내려줍니다.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          # Maven Central 이 러너에 429 를 돌려줄 때가 있어 받은 의존성을 실행 사이에 남겨 둡니다.
          cache: gradle
          cache-dependency-path: |
            client/android/*.gradle*
            client/android/app/*.gradle*
            client/android/gradle/wrapper/gradle-wrapper.properties
            client/pubspec.lock
      - name: Build signed APK
        env:
          KEYSTORE_B64: ${{ secrets.SOLO_KEYSTORE_B64 }}
          SOLO_KEYSTORE_PASSWORD: ${{ secrets.SOLO_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/solo.jks"
            export SOLO_KEYSTORE="$RUNNER_TEMP/solo.jks"
          fi
          name=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          # 의존성 저장소가 429 로 거절하면 잠시 쉬었다가 다시 받습니다.
          for try in 1 2 3; do
            flutter build apk --release --target-platform android-arm64 \
              --build-name "$name" --build-number "${{ github.run_number }}" && break
            [ "$try" = 3 ] && exit 1
            sleep $((try * 45))
          done
          mkdir -p ../apk
          cp build/app/outputs/flutter-apk/app-release.apk ../apk/solo.apk
          echo "$name+${{ github.run_number }}" > ../apk/version.txt
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: apk/

  build:
    needs: [test, client]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: apk/

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/oc-solo-music:latest
            ghcr.io/${{ github.repository_owner }}/oc-solo-music:${{ github.sha }}
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
