# Solo: 내가 만든 수노 곡은 녹음하고 가진 곡 파일은 올려 모아서, 나만 듣는 재생기로 내려줍니다.
services:
  solo:
    image: ghcr.io/jshsakura/oc-solo-music:latest
    container_name: oc-solo-music
    restart: unless-stopped
    ports:
      - "${SOLO_PORT:-8000}:8000"
    shm_size: 1gb          # 녹음용 크롬이 /dev/shm 을 씁니다
    environment:
      TZ: ${TZ:-Asia/Seoul}
      # 인터넷에 직접 열면 반드시 정합니다. 앞단에 다른 인증이 있으면 비워 둡니다.
      SOLO_PASSWORD: ${SOLO_PASSWORD:-}
    volumes:
      # 곡 파일, 표지, solo.db(기기 토큰은 해시로만)가 여기에 남습니다.
      - ${SOLO_LIBRARY:-./library}:/library
